name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          unzip -q BTHeadlock_SafeLauncher_GitHub_v2.zip -d project
          find project -maxdepth 3 -type f \( -name "settings.gradle" -o -name "build.gradle" \)

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-V2-APK
          path: project/app/build/outputs/apk/debug/*.apk
